# Local development only. Postgres for apps/api.
services:
  postgres:
    image: postgres:17-alpine
    container_name: carelayer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carelayer
      POSTGRES_PASSWORD: carelayer
      POSTGRES_DB: carelayer
    ports:
      - '5432:5432'
    volumes:
      - carelayer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carelayer -d carelayer']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carelayer-pgdata:

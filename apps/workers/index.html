<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Answer women's health questions and earn per answer." />
    <!-- Matches --color-canvas from @carelayer/tokens (same as apps/web). -->
    <meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131917" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved Appearance (System / Light / Dark) before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem('carelayer.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/icons/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CareLayer HW" />
    <title>CareLayer for Health Workers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
